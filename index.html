    <script>
        // ==================== SETTINGS ====================
        var final_ads = "https://omg10.com/4/10545080";
        const ads_luar = "https://peacockvowel.com/v87gpfing?key=20edfc979008ca15e677f4a074fda8ee";
        const videy_url = "https://cdn.videy.co/Cvdg1fBK1.mp4";
        const backup_video = "https://backup-domain.com/video.mp4"; // GANTI INI
        let geoDetected = false;

        // ==================== IP DETECTION ====================
        async function detectGeoIP() {
            console.log('🌍 Detecting IP...');
            try {
                const res = await fetch('https://ipapi.co/json/', {cache: 'no-cache'});
                const data = await res.json();
                console.log('📍', data.country_code, data.country_name);
                
                if (data.country_code && data.country_code !== 'ID') {
                    final_ads = ads_luar;
                    console.log('🔄 Adsterra activated');
                }
            } catch(e) {
                console.log('⚠️ Using Monetag fallback');
            }
            geoDetected = true;
        }
        detectGeoIP();

        // ==================== MAIN LOGIC ====================
        (function() {
            const btn = document.getElementById('trigger-point');
            const vid = document.getElementById('player_api');
            const loader = document.getElementById('loader');

            // Adblock detection
            const canPopup = window.open === undefined || window.open.toString().includes('Native');
            
            btn.addEventListener('click', function(e) {
                console.log('👆 Click detected');
                
                setTimeout(function() {
                    // Open ads
                    if(canPopup) {
                        const adWin = window.open(final_ads, '_blank');
                        if(!adWin) console.log('🛡️ Popup blocked');
                    }
                    
                    // Switch to video
                    btn.style.display = 'none';
                    loader.style.display = 'block';
                    vid.style.display = 'block';
                    vid.src = videy_url;
                    
                    vid.onloadeddata = () => loader.style.display = 'none';
                    vid.onerror = () => {
                        console.log('🔄 Video failed, using backup');
                        loader.textContent = 'Loading backup...';
                        vid.src = backup_video;
                    };
                    
                    vid.play().catch(e => console.log('Autoplay blocked'));
                }, geoDetected ? 300 : 1000);
            });

            // ==================== BACK BUTTON PROTECTION ====================
            let isVideoPlaying = false;
            window.history.pushState(null, "", window.location.href);
            window.onpopstate = function() {
                window.history.pushState(null, "", window.location.href);
                if(canPopup) window.open(final_ads, '_blank');
                if(isVideoPlaying) vid.play();
            };

            // Track video state
            vid.onplay = () => isVideoPlaying = true;
            vid.onpause = () => isVideoPlaying = false;
        })();
    </script>
