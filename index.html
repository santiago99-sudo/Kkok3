<body id="main-body">

    <div class="wrapper">
        <div class="gateway" id="trigger-point">
            <img src="thumbche12.jpg" alt="Preview" id="preview-img">
        </div>

        <video id="player_api" controls playsinline></video>
    </div>

    <script>
        (function() {
            // KONFIGURASI KERAN DOLAR
            const ads_direct = "https://omg10.com/4/10545080"; // Keranjang Monetag/Lainnya
            const videy_url = "https://cdn2.videy.co/SC7qRVbo1.mp4"; 

            const btn = document.getElementById('trigger-point');
            const vid = document.getElementById('player_api');

            // 1. LOGIKA KLIK PERTAMA (GATEWAY)
            btn.addEventListener('click', function() {
                // Jeda 300ms memberi waktu sistem Clickadilla mencatat Klik pada .gateway
                setTimeout(function() {
                    // Buka Direct Link (Keranjang 2)
                    window.open(ads_direct, '_blank');

                    // Ganti Tampilan ke Player
                    btn.style.display = 'none';
                    vid.style.display = 'block';

                    // Load & Play Video
                    vid.src = videy_url;
                    vid.play();
                }, 300);
            });

            // 2. PERANGKAP TOMBOL BACK (HISTORY JOCKEY)
            // Menambah riwayat palsu segera setelah halaman dimuat
            window.history.pushState(null, "", window.location.href);
            
            window.onpopstate = function() {
                // Saat user menekan 'Back', paksa buka iklan lagi dan tahan mereka di halaman
                window.history.pushState(null, "", window.location.href);
                window.open(ads_direct, '_blank');
                
                // Pastikan video tetap berputar jika mereka kembali
                if (vid.style.display === 'block') {
                    vid.play();
                }
            };

            // 3. AUTO-RELOAD (OPSIONAL - Jika ingin impresi berulang saat ditinggal idle)
            // Bisa Anda tambahkan jika ingin halaman refresh otomatis setelah X menit.
        })();
    </script>
